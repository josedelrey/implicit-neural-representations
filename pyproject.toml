[project]
name = "implicit-neural-representations"
version = "0.1.0"
description = "Python experiments for fitting implicit neural representations to images and videos."
readme = "README.md"
authors = [
    { name = "José del Rey", email = "josedelreyortega@gmail.com" },
]
keywords = [
    "implicit neural representations",
    "neural fields",
    "computer vision",
    "pytorch",
]
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.10,<3.14"
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "Pillow>=10.0",
    "imageio>=2.34",
    "imageio-ffmpeg>=0.4.9",
    "tensorboard>=2.16",
    "tqdm>=4.66",
    "PyYAML>=6.0,<7",
]

[dependency-groups]
dev = ["ruff==0.16.9"]

[project.scripts]
inr-image = "implicit_neural_representations.image:main"
inr-video = "implicit_neural_representations.video:main"

[project.urls]
Repository = "https://github.com/josedelrey/implicit-neural-representations"
Issues = "https://github.com/josedelrey/implicit-neural-representations/issues"

[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["implicit_neural_representations*"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
